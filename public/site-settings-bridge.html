<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Site settings sync</title></head>
  <body>
    <script>
      window.addEventListener('message', function (event) {
        var data = event.data
        if (!data || data.type !== 'DOMIGEN_APPLY_SETTINGS' || !data.settings) return
        try {
          localStorage.setItem('domigen-site-settings', JSON.stringify(data.settings))
        } catch (error) {
          /* storage unavailable */
        }
        window.parent.postMessage({ type: 'DOMIGEN_SETTINGS_APPLIED' }, '*')
      })
    </script>
  </body>
</html>
